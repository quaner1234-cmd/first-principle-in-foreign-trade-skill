[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-judgment-harness"
version = "0.4.0"
description = "A durable, policy-enforced runtime harness for foreign-trade decisions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Alex"}]
dependencies = []

[project.scripts]
trade-harness = "trade_judgment_harness.cli:main"

[tool.setuptools]
packages = ["trade_judgment_harness"]
